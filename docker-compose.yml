# Dev local: docker compose up --build
# Copie .env.example → .env e use DB_HOST=postgres, REDIS_HOST=redis (ver seção Docker no .env.example)
# Reverb WebSocket: localhost:8081 (paths /app e /apps) | pulse-check: métricas Reverb no /pulse

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"
      AUTORUN_LARAVEL_MIGRATION_ISOLATION: "true"
      AUTORUN_LARAVEL_OPTIMIZE: "true"
      AUTORUN_LARAVEL_STORAGE_LINK: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      HEALTHCHECK_PATH: /up
      SSL_MODE: "off"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - laravel

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      AUTORUN_ENABLED: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    command: ["php", "/var/www/html/artisan", "horizon"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-horizon"]
      start_period: 10s
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - laravel

  cron:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      AUTORUN_ENABLED: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 30s
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - laravel

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      AUTORUN_ENABLED: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    command: ["php", "/var/www/html/artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    stop_signal: SIGTERM
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "healthcheck-reverb"]
      start_period: 10s
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - laravel

  pulse-check:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      AUTORUN_ENABLED: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    command: ["php", "/var/www/html/artisan", "pulse:check"]
    stop_signal: SIGTERM
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - laravel

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      PULSE_DB_DATABASE: ${PULSE_DB_DATABASE:-laravel_pulse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-pulse-db.sh:/docker-entrypoint-initdb.d/02-pulse-db.sh:ro
    networks:
      - laravel

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - laravel

networks:
  laravel:

volumes:
  postgres_data:
  redis_data:
