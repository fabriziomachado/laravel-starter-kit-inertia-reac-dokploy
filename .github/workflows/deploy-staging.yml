name: deploy-staging

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy to Dokploy (staging)
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APPLICATION_ID: ${{ secrets.DOKPLOY_STAGING_WEB_ID }}
          IMAGE: ghcr.io/${{ github.repository }}:staging
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          DOKPLOY_URL="${DOKPLOY_URL%/}"

          response="$(
            curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST "${DOKPLOY_URL}/api/application.deploy" \
              -H "x-api-key: ${DOKPLOY_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"applicationId\":\"${APPLICATION_ID}\",\"title\":\"Deploy staging ${GITHUB_SHA::7}\",\"description\":\"CI/CD from develop branch\"}"
          )"

          http_status="$(echo "${response}" | awk -F: '/HTTP_STATUS:/ { print $2 }')"
          body="$(echo "${response}" | sed '/HTTP_STATUS:/d')"

          echo "${body}"

          if [[ "${http_status}" -lt 200 || "${http_status}" -ge 300 ]]; then
            echo "Dokploy deploy failed with HTTP ${http_status}"
            exit 1
          fi
