name: deploy-production

on:
  push:
    tags:
      - v*

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to Dokploy (production)
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PROD_WEB_ID: ${{ secrets.PROD_WEB_ID }}
          PROD_WORKER_ID: ${{ secrets.PROD_WORKER_ID }}
          PROD_CRON_ID: ${{ secrets.PROD_CRON_ID }}
          GHCR_REGISTRY_USERNAME: ${{ secrets.GHCR_REGISTRY_USERNAME }}
          GHCR_REGISTRY_TOKEN: ${{ secrets.GHCR_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          DOKPLOY_URL="${DOKPLOY_URL%/}"

          deploy_service() {
            local app_id="$1"
            local service_name="$2"

            if [[ -n "${GHCR_REGISTRY_USERNAME:-}" && -n "${GHCR_REGISTRY_TOKEN:-}" ]]; then
              curl -sf -X POST "${DOKPLOY_URL}/api/application.saveDockerProvider" \
                -H "x-api-key: ${DOKPLOY_API_KEY}" \
                -H "Content-Type: application/json" \
                -d "{\"applicationId\":\"${app_id}\",\"dockerImage\":\"${IMAGE}\",\"registryUrl\":\"ghcr.io\",\"username\":\"${GHCR_REGISTRY_USERNAME}\",\"password\":\"${GHCR_REGISTRY_TOKEN}\"}"
            fi

            response="$(
              curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST "${DOKPLOY_URL}/api/application.deploy" \
                -H "x-api-key: ${DOKPLOY_API_KEY}" \
                -H "Content-Type: application/json" \
                -d "{\"applicationId\":\"${app_id}\",\"title\":\"Deploy ${service_name} ${GITHUB_REF_NAME}\",\"description\":\"Production release ${GITHUB_REF_NAME}\"}"
            )"

            http_status="$(echo "${response}" | awk -F: '/HTTP_STATUS:/ { print $2 }')"
            body="$(echo "${response}" | sed '/HTTP_STATUS:/d')"

            echo "${body}"

            if [[ "${http_status}" -lt 200 || "${http_status}" -ge 300 ]]; then
              echo "Dokploy deploy failed for ${service_name} with HTTP ${http_status}"
              exit 1
            fi
          }

          deploy_service "${PROD_WEB_ID}" "laravel-web"
          deploy_service "${PROD_WORKER_ID}" "laravel-worker"
          deploy_service "${PROD_CRON_ID}" "laravel-cron"
