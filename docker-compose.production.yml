# Dokploy: Compose Type = Stack | Provider = Raw
# Environment tab: DOCKER_IMAGE + vars Laravel (Dokploy gera o .env)
# Domains tab: serviço web, porta 8080
# Postgres/Redis: serviços do ambiente Dokploy (DB_HOST / REDIS_HOST na Environment)

x-laravel-image: &laravel-image ${DOCKER_IMAGE:-ghcr.io/fabriziomachado/laravel-starter-kit-inertia-reac-dokploy:latest}

services:
  web:
    image: *laravel-image
    env_file:
      - .env
    environment:
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"
      AUTORUN_LARAVEL_MIGRATION_ISOLATION: "true"
      AUTORUN_LARAVEL_OPTIMIZE: "true"
      AUTORUN_LARAVEL_STORAGE_LINK: "true"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - dokploy-network
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

  worker:
    image: *laravel-image
    env_file:
      - .env
    environment:
      AUTORUN_ENABLED: "false"
    command: php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  cron:
    image: *laravel-image
    env_file:
      - .env
    environment:
      AUTORUN_ENABLED: "false"
    command: php /var/www/html/artisan schedule:work
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: stop-first

networks:
  dokploy-network:
    external: true
